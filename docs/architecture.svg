<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="hello-stack architecture: your computer reaches the app on port 8000; the app queries the database on db:5432 inside a private Docker Compose network; the database stores data in a volume and runs a pgvector setup script on first start">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="420" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="700" fill="#0f172a">hello-stack architecture</text>

  <!-- Your Mac -->
  <rect x="20" y="150" width="120" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="80" y="186" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Your computer</text>
  <text x="80" y="210" font-size="12.5" fill="#334155" text-anchor="middle">browser or curl</text>
  <text x="80" y="232" font-size="11" fill="#475569" text-anchor="middle">localhost:8000</text>

  <!-- Compose network -->
  <rect x="220" y="64" width="580" height="340" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="240" y="92" font-size="13" font-weight="600" fill="#475569">Docker Compose private network</text>

  <!-- Mac to app -->
  <line x1="140" y1="205" x2="246" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="179" y="195" font-size="11" fill="#334155" text-anchor="middle">port 8000</text>
  <text x="179" y="223" font-size="10.5" fill="#64748b" text-anchor="middle">localhost only</text>

  <!-- app -->
  <rect x="250" y="140" width="220" height="140" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="360" y="170" font-size="16" font-weight="700" fill="#3730a3" text-anchor="middle">app</text>
  <text x="360" y="194" font-size="12.5" fill="#1e293b" text-anchor="middle">FastAPI + Uvicorn</text>
  <text x="360" y="218" font-size="12" fill="#1e293b" text-anchor="middle" font-family="Menlo, monospace">GET /health</text>
  <text x="360" y="238" font-size="12" fill="#1e293b" text-anchor="middle" font-family="Menlo, monospace">POST /echo</text>
  <text x="360" y="264" font-size="11" fill="#475569" text-anchor="middle">runs as a non-root user</text>

  <!-- app to db -->
  <line x1="470" y1="205" x2="556" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="514" y="195" font-size="11" fill="#334155" text-anchor="middle">SQL query</text>
  <text x="514" y="223" font-size="10.5" fill="#64748b" text-anchor="middle">to db:5432</text>

  <!-- db -->
  <rect x="560" y="140" width="210" height="140" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="665" y="170" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">db</text>
  <text x="665" y="194" font-size="12.5" fill="#1e293b" text-anchor="middle">Postgres 17</text>
  <text x="665" y="216" font-size="12.5" fill="#1e293b" text-anchor="middle">+ pgvector extension</text>
  <text x="665" y="264" font-size="11" fill="#b45309" text-anchor="middle">no port published</text>

  <!-- init script -->
  <rect x="250" y="318" width="260" height="58" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="341" font-size="11" fill="#78350f" text-anchor="middle" font-family="Menlo, monospace">db/init/001_enable_pgvector.sql</text>
  <text x="380" y="362" font-size="11" fill="#92400e" text-anchor="middle">runs once, on an empty database</text>
  <path d="M510 334 L594 286" stroke="#d97706" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- volume -->
  <line x1="665" y1="280" x2="665" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M590 322 L590 372 A75 10 0 0 0 740 372 L740 322" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <ellipse cx="665" cy="322" rx="75" ry="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="665" y="352" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">db-data volume</text>
  <text x="665" y="368" font-size="10.5" fill="#475569" text-anchor="middle">keeps data across restarts</text>

</svg>
