[project]
name = "hello-stack"
version = "0.1.0"
description = "A skeleton FastAPI and Postgres/pgvector service that runs with one command."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
